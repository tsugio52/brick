<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed 3D yard; HUD hugs the corners like stencilled site signage */

  --f-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-body)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.hud{position:fixed;pointer-events:none;z-index:2}
.hud > *{pointer-events:auto}
#top{top:calc(14px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.title{font-family:var(--f-display);font-size:22px;letter-spacing:.04em;line-height:1;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.title small{display:block;font-family:var(--f-body);font-weight:500;font-size:11.5px;letter-spacing:.06em;color:var(--ink-dim);margin-top:6px}
.stats{display:flex;gap:2px;background:var(--panel);border:1px solid var(--panel-line);border-radius:6px;padding:6px 4px;backdrop-filter:blur(6px);width:max-content}
.stat{padding:0 10px;display:flex;flex-direction:column;gap:2px}
.stat + .stat{border-left:1px solid var(--panel-line)}
.stat b{font-family:var(--f-num);font-size:18px;font-variant-numeric:tabular-nums;font-weight:500}
.stat span{font-size:10.5px;letter-spacing:.08em;color:var(--ink-dim)}

button{font-family:var(--f-body);font-weight:700;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--panel-line);border-radius:6px;padding:8px 12px;cursor:pointer;backdrop-filter:blur(6px)}
button:hover{border-color:rgba(255,240,215,.35)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#bottom{left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:10px;width:min(440px,calc(100vw - 32px))}
.pick{display:flex;background:var(--panel);border:1px solid var(--panel-line);border-radius:8px;padding:4px;gap:4px;backdrop-filter:blur(6px)}
.pick button{background:transparent;border:0;border-radius:5px;padding:8px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:132px}

}

<canvas id="c" aria-label="投てき場の3Dビュー"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const rand = (a,b) => a + Math.random()*(b-a);
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
const V3 = (x,y,z) => new THREE.Vector3(x,y,z);

/* ---------------- renderer / scene ---------------- */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfc7cc);
scene.fog = new THREE.Fog(0xbfc7cc, 18, 60);

const camera = new THREE.PerspectiveCamera(58, 1, 0.05, 120);
scene.add(camera);
let throwDist = 6;
function placeCamera(){
  camera.position.set(0, 1.55, throwDist);
  camera.lookAt(0, 0.95, 0);
}
placeCamera();

const hemi = new THREE.HemisphereLight(0xdfe7ee, 0x6b6157, 0.75);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dc, 2.0);
sun.position.set(-4, 9, 7);
sun.target.position.set(0, 0, 1.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-7, right:7, top:7, bottom:-5, near:1, far:30});
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.015;
scene.add(sun, sun.target);

/* ---------------- procedural textures ---------------- */
function makeCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function toTex(c, srgb){
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (srgb) t.encoding = THREE.sRGBEncoding;
  t.anisotropy = maxAniso;
  return t;
}
// wrapped soft blob so the tile repeats without seams
function blob(g,w,h,x,y,r,col){
  for (let ox=-1; ox<=1; ox++) for (let oy=-1; oy<=1; oy++){
    const cx = x+ox*w, cy = y+oy*h;
    if (cx+r<0||cx-r>w||cy+r<0||cy-r>h) continue;
    const gr = g.createRadialGradient(cx,cy,0,cx,cy,r);
    gr.addColorStop(0,col); gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(cx-r,cy-r,r*2,r*2);
  }
}
function specks(g,w,h,n,colFn,rmin,rmax){
  for (let i=0;i<n;i++){
    g.fillStyle = colFn();
    const r = rand(rmin,rmax), x=Math.random()*w, y=Math.random()*h;
    g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill();
  }
}
function stones(g,w,h,n,colFn,rmin,rmax){
  for (let i=0;i<n;i++){
    const x=Math.random()*w, y=Math.random()*h, r=rand(rmin,rmax), k=5+(Math.random()*4|0);
    g.fillStyle = colFn(); g.beginPath();
    for (let j=0;j<k;j++){ const a=j/k*Math.PI*2+rand(-.3,.3), rr=r*rand(.6,1.1); const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr; j?g.lineTo(px,py):g.moveTo(px,py); }
    g.closePath(); g.fill();
  }
}
function brickOuterTex(){
  const S=512, c=makeCanvas(S,S), g=c.getContext('2d');
  g.fillStyle='#8f4128'; g.fillRect(0,0,S,S);
  for (let i=0;i<70;i++) blob(g,S,S,Math.random()*S,Math.random()*S,rand(30,110), `hsla(${rand(8,22)},${rand(45,60)}%,${rand(22,42)}%,${rand(.18,.35)})`);
  for (let i=0;i<14;i++) blob(g,S,S,Math.random()*S,Math.random()*S,rand(40,90), `rgba(40,22,15,${rand(.12,.25)})`); // kiln flashing
  specks(g,S,S,9000,()=>`hsla(${rand(10,25)},${rand(35,55)}%,${rand(25,48)}%,${rand(.25,.6)})`,.4,1.4);
  specks(g,S,S,1600,()=>`rgba(214,180,150,${rand(.25,.6)})`,.3,1.1);   // sand
  specks(g,S,S,900,()=>`rgba(30,16,10,${rand(.4,.8)})`,.4,1.6);        // pits
  return c;
}
function brickInnerTex(){
  const S=512, c=makeCanvas(S,S), g=c.getContext('2d');
  g.fillStyle='#ad5b3c'; g.fillRect(0,0,S,S);
  for (let i=0;i<50;i++) blob(g,S,S,Math.random()*S,Math.random()*S,rand(20,80), `hsla(${rand(12,24)},${rand(50,62)}%,${rand(38,52)}%,${rand(.2,.4)})`);
  specks(g,S,S,16000,()=>`hsla(${rand(12,26)},${rand(40,60)}%,${rand(30,58)}%,${rand(.3,.7)})`,.4,1.5);
  specks(g,S,S,2500,()=>`rgba(230,200,170,${rand(.3,.7)})`,.3,1.2);
  specks(g,S,S,2200,()=>`rgba(50,24,14,${rand(.5,.9)})`,.5,2.2);
  return c;
}
function blockOuterTex(){
  const S=512, c=makeCanvas(S,S), g=c.getContext('2d');
  g.fillStyle='#8b8a85'; g.fillRect(0,0,S,S);
  for (let i=0;i<60;i++) blob(g,S,S,Math.random()*S,Math.random()*S,rand(30,120), `hsla(${rand(30,50)},${rand(3,8)}%,${rand(42,62)}%,${rand(.15,.3)})`);
  specks(g,S,S,14000,()=>`hsla(40,${rand(2,6)}%,${rand(35,70)}%,${rand(.25,.6)})`,.4,1.3);
  specks(g,S,S,5000,()=>`rgba(28,27,25,${rand(.45,.85)})`,.5,2.4);   // open pores typical of block
  stones(g,S,S,300,()=>`hsla(${rand(20,45)},${rand(5,15)}%,${rand(35,60)}%,.6)`,1.5,3.5);
  return c;
}
function blockInnerTex(){
  const S=512, c=makeCanvas(S,S), g=c.getContext('2d');
  g.fillStyle='#a3a29b'; g.fillRect(0,0,S,S);
  specks(g,S,S,12000,()=>`hsla(40,${rand(2,6)}%,${rand(45,75)}%,${rand(.3,.6)})`,.4,1.4);
  stones(g,S,S,1400,()=>`hsla(${rand(15,50)},${rand(4,18)}%,${rand(28,62)}%,${rand(.7,.95)})`,1.6,5.5);
  specks(g,S,S,3500,()=>`rgba(35,34,31,${rand(.5,.9)})`,.6,2.6);
  return c;
}
function wallTex(){
  const W=2048, H=640, c=makeCanvas(W,H), g=c.getContext('2d');
  const pxm = W/8; // 8 m wide wall
  g.fillStyle='#a7a59e'; g.fillRect(0,0,W,H);
  for (let i=0;i<220;i++) blob(g,W,H,Math.random()*W,Math.random()*H,rand(40,200), `hsla(${rand(30,50)},${rand(3,8)}%,${rand(48,72)}%,${rand(.08,.2)})`);
  specks(g,W,H,40000,()=>`hsla(40,4%,${rand(40,80)}%,${rand(.15,.4)})`,.4,1.3);
  specks(g,W,H,5000,()=>`rgba(50,48,44,${rand(.3,.7)})`,.5,1.8);   // bug holes
  // rain streaks from the top edge
  for (let i=0;i<120;i++){ const x=Math.random()*W, w=rand(4,26), len=rand(60,H*.9);
    const gr=g.createLinearGradient(0,0,0,len); gr.addColorStop(0,`rgba(60,58,52,${rand(.12,.28)})`); gr.addColorStop(1,'rgba(60,58,52,0)');
    g.fillStyle=gr; g.fillRect(x,0,w,len); }
  // splash dirt at the foot
  const gr=g.createLinearGradient(0,H,0,H-120); gr.addColorStop(0,'rgba(55,50,42,.55)'); gr.addColorStop(1,'rgba(55,50,42,0)');
  g.fillStyle=gr; g.fillRect(0,H-120,W,120);
  // formwork panel joints (1800 × 900)
  g.strokeStyle='rgba(70,68,62,.55)'; g.lineWidth=2;
  for (let x=0.2*pxm; x<W; x+=1.8*pxm){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,H); g.stroke(); }
  for (let y=H-0.9*pxm; y>0; y-=0.9*pxm){ g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); }
  // separator cone holes (P-con)
  for (let x=0.2*pxm+0.45*pxm; x<W; x+=0.9*pxm) for (let y=H-0.45*pxm; y>0; y-=0.6*pxm){
    const r=0.017*pxm;
    g.fillStyle='rgba(120,118,110,1)'; g.beginPath(); g.arc(x,y,r*1.25,0,7); g.fill();
    g.fillStyle='rgba(58,56,52,1)'; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
    g.fillStyle='rgba(95,92,86,1)'; g.beginPath(); g.arc(x,y,r*.45,0,7); g.fill();
  }
  return c;
}
function asphaltTex(){
  const S=1024, c=makeCanvas(S,S), g=c.getContext('2d');
  g.fillStyle='#45433f'; g.fillRect(0,0,S,S);
  for (let i=0;i<80;i++) blob(g,S,S,Math.random()*S,Math.random()*S,rand(60,220), `rgba(${rand(25,90)|0},${rand(25,88)|0},${rand(25,82)|0},${rand(.08,.2)})`);
  stones(g,S,S,9000,()=>`hsla(${rand(20,45)},${rand(0,8)}%,${rand(30,62)}%,${rand(.5,.9)})`,1,3.2);
  specks(g,S,S,9000,()=>`rgba(18,18,17,${rand(.5,.9)})`,.6,2);
  return c;
}

const T = {
  brickO: brickOuterTex(), brickI: brickInnerTex(),
  blockO: blockOuterTex(), blockI: blockInnerTex()
};
function stoneMat(cv, rough, bump){
  const map = toTex(cv,true), b = toTex(cv,false);
  return new THREE.MeshStandardMaterial({map, bumpMap:b, bumpScale:bump, roughness:rough, metalness:0});
}
const MATS = {
  brick: [stoneMat(T.brickO,.9,.012), stoneMat(T.brickI,.97,.02)],
  block: [stoneMat(T.blockO,.95,.018), stoneMat(T.blockI,.98,.025)]
};

/* ---------------- environment ---------------- */
const wallW=8, wallH=2.4, wallT=0.3;
const wallCv = wallTex();
const wallMap = toTex(wallCv,true); wallMap.wrapS=wallMap.wrapT=THREE.ClampToEdgeWrapping;
const wallMat = new THREE.MeshStandardMaterial({map:wallMap, bumpMap:toTex(wallCv,false), bumpScale:.01, roughness:.88});
const wallSide = new THREE.MeshStandardMaterial({color:0x9c9a93, roughness:.9});
const wallMesh = new THREE.Mesh(new THREE.BoxGeometry(wallW,wallH,wallT), [wallSide,wallSide,wallSide,wallSide,wallMat,wallSide]);
wallMesh.position.set(0, wallH/2, -wallT/2);
wallMesh.receiveShadow = true; wallMesh.castShadow = true;
scene.add(wallMesh);

const asph = toTex(asphaltTex(), true); asph.repeat.set(16,16);
const asphB = toTex(asphaltTex(), false); asphB.repeat.set(16,16);
const groundMesh = new THREE.Mesh(new THREE.PlaneGeometry(48,48), new THREE.MeshStandardMaterial({map:asph,bumpMap:asphB,bumpScale:.015,roughness:.96}));
groundMesh.rotation.x = -Math.PI/2; groundMesh.receiveShadow = true;
scene.add(groundMesh);

// distant backdrop: neighbouring wall + hazy treeline
const backWall = new THREE.Mesh(new THREE.BoxGeometry(60,4,0.4), new THREE.MeshStandardMaterial({color:0x8d8b84,roughness:1}));
backWall.position.set(0,2,-14); scene.add(backWall);

/* ---------------- physics ---------------- */
const world = new CANNON.World();
world.gravity.set(0,-9.81,0);
world.broadphase = new CANNON.SAPBroadphase(world);
world.allowSleep = true;
world.solver.iterations = 12;
const mStatic = new CANNON.Material('static'), mStone = new CANNON.Material('stone');
world.addContactMaterial(new CANNON.ContactMaterial(mStatic, mStone, {friction:.7, restitution:.12}));
world.addContactMaterial(new CANNON.ContactMaterial(mStone, mStone, {friction:.65, restitution:.06}));
const G_WORLD=1, G_OLD=2, G_NEW=4;
function staticBody(shape, pos, quat){
  const b = new CANNON.Body({mass:0, material:mStatic});
  b.addShape(shape); b.position.set(pos.x,pos.y,pos.z);
  if (quat) b.quaternion.set(quat.x,quat.y,quat.z,quat.w);
  b.collisionFilterGroup = G_WORLD; b.collisionFilterMask = -1;
  world.addBody(b); return b;
}
staticBody(new CANNON.Plane(), V3(0,0,0), new THREE.Quaternion().setFromAxisAngle(V3(1,0,0),-Math.PI/2));
staticBody(new CANNON.Box(new CANNON.Vec3(wallW/2,wallH/2,wallT/2)), wallMesh.position);
staticBody(new CANNON.Box(new CANNON.Vec3(30,2,.2)), backWall.position);
const removeBody = b => (world.removeBody ? world.removeBody(b) : world.remove(b));

/* ---------------- convex polytopes & fracture ---------------- */
const EPS = 1e-7;
const BOX_F = [[0,4,6,2],[1,3,7,5],[0,1,5,4],[2,6,7,3],[0,2,3,1],[4,5,7,6]];
const BOX_N = [V3(-1,0,0),V3(1,0,0),V3(0,-1,0),V3(0,1,0),V3(0,0,-1),V3(0,0,1)];
function boxPoly(min,max,inner,offset){
  const c = i => V3(i&1?max.x:min.x, i&2?max.y:min.y, i&4?max.z:min.z);
  return {faces: BOX_F.map((f,i)=>({verts:f.map(c), n:BOX_N[i].clone(), inner:!!(inner&&inner[i])})), offset:offset.clone()};
}
function volCent(p){
  if (p._v !== undefined) return p;
  const o = p.faces[0].verts[0]; let vol=0; const C=V3(0,0,0);
  const a=V3(), b=V3(), cc=V3(), t=V3();
  for (const f of p.faces){
    const vs=f.verts;
    for (let i=1;i<vs.length-1;i++){
      a.subVectors(vs[0],o); b.subVectors(vs[i],o); cc.subVectors(vs[i+1],o);
      const v = a.dot(t.crossVectors(b,cc))/6;
      vol += v;
      C.addScaledVector(V3(o.x+vs[0].x+vs[i].x+vs[i+1].x, o.y+vs[0].y+vs[i].y+vs[i+1].y, o.z+vs[0].z+vs[i].z+vs[i+1].z), v/4);
    }
  }
  p._v = Math.abs(vol); p._c = Math.abs(vol)>1e-12 ? C.multiplyScalar(1/vol) : o.clone();
  return p;
}
function aabb(p){
  const mn=V3(Infinity,Infinity,Infinity), mx=V3(-Infinity,-Infinity,-Infinity);
  for (const f of p.faces) for (const v of f.verts){ mn.min(v); mx.max(v); }
  return {min:mn,max:mx};
}
function splitPoly(p,n,d){
  const front=[], back=[], on=[];
  for (const f of p.faces){
    const fv=[], bv=[]; let hasF=false, hasB=false; const vs=f.verts, L=vs.length;
    for (let i=0;i<L;i++){
      const a=vs[i], b=vs[(i+1)%L];
      const da=n.dot(a)-d, db=n.dot(b)-d;
      const ca = da>EPS?1:da<-EPS?-1:0, cb = db>EPS?1:db<-EPS?-1:0;
      if (ca>0) hasF=true; if (ca<0) hasB=true;
      if (ca>=0) fv.push(a); if (ca<=0) bv.push(a); if (ca===0) on.push(a);
      if (ca*cb<0){ const q=a.clone().lerp(b, da/(da-db)); fv.push(q); bv.push(q); on.push(q); }
    }
    if (hasF && fv.length>=3) front.push({verts:fv,n:f.n,inner:f.inner});
    if (hasB && bv.length>=3) back.push({verts:bv,n:f.n,inner:f.inner});
  }
  const pts=[];
  for (const q of on) if (!pts.some(r=>r.distanceToSquared(q)<1e-12)) pts.push(q);
  if (pts.length<3 || front.length<3 || back.length<3) return null;
  const c = pts.reduce((s,q)=>s.add(q),V3(0,0,0)).multiplyScalar(1/pts.length);
  const u = Math.abs(n.x)<.9 ? V3(1,0,0).cross(n).normalize() : V3(0,1,0).cross(n).normalize();
  const w = n.clone().cross(u);
  const tmp=V3();
  pts.sort((A,B)=>{ tmp.subVectors(A,c); const aa=Math.atan2(tmp.dot(w),tmp.dot(u)); tmp.subVectors(B,c); return aa-Math.atan2(tmp.dot(w),tmp.dot(u)); });
  back.push({verts:pts.slice(), n:n.clone(), inner:true});
  front.push({verts:pts.slice().reverse(), n:n.clone().negate(), inner:true});
  return [{faces:front, offset:p.offset.clone()}, {faces:back, offset:p.offset.clone()}];
}
function randUnit(){ const z=rand(-1,1), a=rand(0,Math.PI*2), r=Math.sqrt(1-z*z); return V3(r*Math.cos(a), r*Math.sin(a), z); }
function fracture(poly, count, hit, bias){
  let pieces=[poly]; let guard=0;
  const minV = Math.max(1.5e-6, volCent(poly)._v*0.012);
  while (pieces.length<count && guard++<count*10){
    pieces.sort((a,b)=>volCent(b)._v-volCent(a)._v);
    const p = pieces[0], bb = aabb(p);
    const pt = V3(rand(.3,.7),rand(.3,.7),rand(.3,.7)).multiply(bb.max.clone().sub(bb.min)).add(bb.min);
    if (hit) pt.lerp(hit.clone().clamp(bb.min,bb.max), .3);
    let nrm = randUnit();
    if (bias && pieces.length===1) nrm.add(bias).normalize();
    const r = splitPoly(p, nrm, nrm.dot(pt));
    if (!r) continue;
    if (volCent(r[0])._v<minV || volCent(r[1])._v<minV) continue;
    pieces[0]=r[0]; pieces.push(r[1]);
  }
  return pieces;
}
function recenter(p){
  volCent(p); const c=p._c.clone();
  const q = {faces:p.faces.map(f=>({verts:f.verts.map(v=>v.clone().sub(c)), n:f.n, inner:f.inner})), offset:p.offset.clone().add(c)};
  q._v = p._v; q._c = V3(0,0,0);
  return {poly:q, c};
}

/* ---------------- geometry from polytopes ---------------- */
function partsGeometry(parts, tile){
  const out=[[],[],[]], inn=[[],[],[]];
  const e1=V3(), e2=V3(), cr=V3();
  for (const p of parts) for (const f of p.faces){
    const n=f.n, ax=Math.abs(n.x)>Math.abs(n.y)?(Math.abs(n.x)>Math.abs(n.z)?0:2):(Math.abs(n.y)>Math.abs(n.z)?1:2);
    const tgt = f.inner?inn:out, vs=f.verts;
    for (let i=1;i<vs.length-1;i++){
      let a=vs[0], b=vs[i], c=vs[i+1];
      e1.subVectors(b,a); e2.subVectors(c,a); cr.crossVectors(e1,e2);
      if (cr.lengthSq()<1e-16) continue;
      if (cr.dot(n)<0){ const t=b; b=c; c=t; }
      for (const v of [a,b,c]){
        tgt[0].push(v.x,v.y,v.z); tgt[1].push(n.x,n.y,n.z);
        const wx=v.x+p.offset.x, wy=v.y+p.offset.y, wz=v.z+p.offset.z;
        if (ax===0) tgt[2].push(wz/tile, wy/tile); else if (ax===1) tgt[2].push(wx/tile, wz/tile); else tgt[2].push(wx/tile, wy/tile);
      }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(out[0].concat(inn[0]),3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(out[1].concat(inn[1]),3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(out[2].concat(inn[2]),2));
  g.addGroup(0, out[0].length/3, 0); g.addGroup(out[0].length/3, inn[0].length/3, 1);
  g.computeBoundingSphere();
  return g;
}

/* ---------------- kinds ---------------- */
const KIND = {
  brick:{ density:1850, tile:.34, thr:6.5, vmin:5, vmax:24, dust:0xb07158, freq:2600 },
  block:{ density:2000, tile:.42, thr:4.8, vmin:3.5, vmax:13, dust:0xbab7ae, freq:1300 }
};
function brickParts(off){
  return [boxPoly(V3(-.105,-.03,-.05), V3(.105,.03,.05), null, off)];
}
function blockParts(off){
  // JIS C-type hollow block: 390 × 190 × 150, cores open top-to-bottom
  const L=.39/2, H=.19/2, Tz=.15/2, s=.028, w=.03;
  const parts=[
    boxPoly(V3(-L,-H, Tz-s), V3(L,H,Tz), null, off),          // face shell
    boxPoly(V3(-L,-H,-Tz),   V3(L,H,-Tz+s), null, off),       // face shell
  ];
  const webIn=[0,0,0,0,1,1];
  for (const x of [-L, -w/2, L-w]) parts.push(boxPoly(V3(x,-H,-Tz+s), V3(x+w,H,Tz-s), webIn, off));
  return parts;
}

/* ---------------- pieces ---------------- */
const pieces = [];   // everything thrown or broken off
let fragCount = 0, thrown = 0, broken = 0;
const breakQueue = [];
let sim = 0;

function makePiece(kind, parts, gen, shrink){
  const K = KIND[kind];
  let vol = 0; for (const p of parts) vol += volCent(p)._v;
  const mass = Math.max(.004, vol*K.density);
  const body = new CANNON.Body({mass, material:mStone});
  for (const p of parts){
    const bb = aabb(p), half = bb.max.clone().sub(bb.min).multiplyScalar(.5*shrink), c = bb.max.clone().add(bb.min).multiplyScalar(.5);
    body.addShape(new CANNON.Box(new CANNON.Vec3(Math.max(half.x,.004),Math.max(half.y,.004),Math.max(half.z,.004))), new CANNON.Vec3(c.x,c.y,c.z));
  }
  body.linearDamping = .01; body.angularDamping = .06;
  body.sleepSpeedLimit = .12; body.sleepTimeLimit = .5;
  const mesh = new THREE.Mesh(partsGeometry(parts, K.tile), MATS[kind]);
  mesh.castShadow = true; mesh.receiveShadow = true;
  scene.add(mesh);
  const pc = {kind, parts, gen, body, mesh, vol, born:sim, dead:false, isFrag:gen>0};
  body.addEventListener('collide', e => onCollide(pc, e));
  return pc;
}
function addPiece(pc){ world.addBody(pc.body); pieces.push(pc); if (pc.isFrag) fragCount++; }
function killPiece(pc){
  pc.dead = true; removeBody(pc.body); scene.remove(pc.mesh); pc.mesh.geometry.dispose();
  const i = pieces.indexOf(pc); if (i>=0) pieces.splice(i,1);
  if (pc.isFrag) fragCount--;
}

function threshold(pc){ return KIND[pc.kind].thr * (1 + .5*pc.gen) * (pc.vol<4e-5 ? 1.4 : 1); }

const tmpV = new CANNON.Vec3();
function onCollide(pc, e){
  if (pc.dead || pc.queued) return;
  const c = e.contact;
  const s = Math.abs(c.getImpactVelocityAlongNormal());
  const mine = c.bi === pc.body;
  if (s > threshold(pc) && pc.gen < 4 && pc.vol > 5e-6){
    const pt = mine ? c.bi.position.vadd(c.ri) : c.bj.position.vadd(c.rj);
    const nAway = mine ? c.ni.negate(tmpV) : c.ni;
    pc.queued = true;
    breakQueue.push({pc, speed:s, point:V3(pt.x,pt.y,pt.z), nAway:V3(nAway.x,nAway.y,nAway.z),
      v:V3(pc.body.velocity.x,pc.body.velocity.y,pc.body.velocity.z), w:V3(pc.body.angularVelocity.x,pc.body.angularVelocity.y,pc.body.angularVelocity.z)});
  } else if (s > 1.1){
    const pt = mine ? c.bi.position.vadd(c.ri) : c.bj.position.vadd(c.rj);
    playHit(pc.kind, s, pc.vol);
    if (s > 3 && pc.vol > 2e-4) puff(V3(pt.x,pt.y,pt.z), V3(0,1,0), pc.kind, 3, s*.1);
  }
}

function breakPiece(job){
  const pc = job.pc; if (pc.dead) return;
  const K = KIND[pc.kind];
  const pos = V3(pc.body.position.x,pc.body.position.y,pc.body.position.z);
  const quat = new THREE.Quaternion(pc.body.quaternion.x,pc.body.quaternion.y,pc.body.quaternion.z,pc.body.quaternion.w);
  const inv = quat.clone().invert();
  const hitLocal = job.point.clone().sub(pos).applyQuaternion(inv);
  const over = job.speed - threshold(pc);
  killPiece(pc);
  if (pc.gen===0) broken++;

  const isBlock = pc.kind==='block' && pc.gen===0;
  let made = 0;
  for (const part of pc.parts){
    let n;
    if (pc.gen===0){
      if (pc.kind==='brick') n = clamp(Math.round(2 + over*1.1 + rand(0,2)), 2, 13);
      else { const web = part.faces[4].inner; n = web ? clamp(Math.round(rand(0,1.6)+over*.3),1,3) : clamp(Math.round(2 + over*.9 + rand(0,2)),2,8); }
    } else n = clamp(Math.round(2 + over*.5 + rand(0,1)), 2, 4);
    // bricks most often snap across the long axis first
    const bias = (pc.kind==='brick' && pc.gen===0) ? V3(2.2,0,0) : null;
    const shards = n>1 ? fracture(part, n, hitLocal, bias) : [part];
    for (const sh of shards){
      const {poly, c} = recenter(sh);
      const fp = makePiece(pc.kind, [poly], pc.gen+1, .82);
      const wc = c.clone().applyQuaternion(quat).add(pos);
      fp.body.position.set(wc.x,wc.y,wc.z);
      fp.body.quaternion.set(quat.x,quat.y,quat.z,quat.w);
      const r = wc.clone().sub(pos);
      const radial = wc.clone().sub(job.point); const rl = radial.length() || 1; radial.multiplyScalar(1/rl);
      const vel = job.v.clone().multiplyScalar(.28)
        .add(job.w.clone().cross(r).multiplyScalar(.5))
        .addScaledVector(job.nAway, job.speed*rand(.06,.18))
        .addScaledVector(radial, Math.max(0,over)*rand(.12,.35) + rand(.2,.8))
        .add(V3(rand(-.3,.3),rand(0,.4),rand(-.3,.3)));
      fp.body.velocity.set(vel.x,vel.y,vel.z);
      const av = job.w.clone().multiplyScalar(.4).add(randUnit().multiplyScalar(rand(2,8)+over));
      fp.body.angularVelocity.set(av.x,av.y,av.z);
      fp.body.collisionFilterGroup = G_NEW; fp.body.collisionFilterMask = G_WORLD|G_OLD;
      fp.newUntil = sim + .09;
      syncMesh(fp);
      addPiece(fp); made++;
    }
  }
  puff(job.point, job.nAway, pc.kind, clamp(8 + made*2, 8, 34), 1 + over*.15);
  playBreak(pc.kind, clamp(job.speed/18,.2,1), pc.vol, made);
  trimDebris();
}

const MAX_FRAGS = 320;
function trimDebris(){
  while (fragCount > MAX_FRAGS){
    const old = pieces.find(p=>p.isFrag);
    if (!old) break; killPiece(old);
  }
}
function syncMesh(pc){
  pc.mesh.position.set(pc.body.position.x,pc.body.position.y,pc.body.position.z);
  pc.mesh.quaternion.set(pc.body.quaternion.x,pc.body.quaternion.y,pc.body.quaternion.z,pc.body.quaternion.w);
}

/* ---------------- dust ---------------- */
const dustTex = (()=>{ const c=makeCanvas(64,64), g=c.getContext('2d'); const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,.9)'); gr.addColorStop(.45,'rgba(255,255,255,.35)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr; g.fillRect(0,0,64,64); return new THREE.CanvasTexture(c); })();
const dust = [];
function puff(p, nrm, kind, n, power){
  for (let i=0;i<n;i++){
    if (dust.length > 160){ const d=dust.shift(); scene.remove(d.s); d.s.material.dispose(); }
    const m = new THREE.SpriteMaterial({map:dustTex, color:KIND[kind].dust, transparent:true, depthWrite:false, opacity:.5});
    const s = new THREE.Sprite(m);
    s.position.copy(p).add(V3(rand(-.05,.05),rand(-.03,.05),rand(-.05,.05)));
    const v = nrm.clone().multiplyScalar(rand(.3,1.4)*power).add(randUnit().multiplyScalar(rand(.3,1.6)*power));
    const sz = rand(.05,.14); s.scale.set(sz,sz,sz);
    scene.add(s);
    dust.push({s, v, life:0, max:rand(1.2,2.8), grow:rand(.25,.6), a0:rand(.3,.6)});
  }
}
function updateDust(dt){
  for (let i=dust.length-1;i>=0;i--){
    const d = dust[i]; d.life += dt;
    const k = d.life/d.max;
    if (k>=1){ scene.remove(d.s); d.s.material.dispose(); dust.splice(i,1); continue; }
    d.v.multiplyScalar(Math.exp(-3.2*dt)); d.v.y += .12*dt;
    d.s.position.addScaledVector(d.v, dt);
    if (d.s.position.y<.02) d.s.position.y=.02;
    const sc = d.s.scale.x + d.grow*dt; d.s.scale.set(sc,sc,sc);
    d.s.material.opacity = d.a0*(1-k)*(1-k);
  }
}

/* ---------------- audio ---------------- */
let AC = null, noiseBuf = null, soundOn = true, hitBudget = 0;
function initAudio(){
  if (!AC){
    try{
      AC = new (window.AudioContext||window.webkitAudioContext)();
      const len = AC.sampleRate*1.5; noiseBuf = AC.createBuffer(1,len,AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i=0;i<len;i++) d[i]=Math.random()*2-1;
    }catch(e){ AC = null; }
  }
  if (AC && AC.state==='suspended') AC.resume();
}
function noiseBurst(t, dur, type, freq, q, gain){
  const src = AC.createBufferSource(); src.buffer = noiseBuf; src.playbackRate.value = rand(.85,1.15);
  const f = AC.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q;
  const g = AC.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(gain,t+.002); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(f); f.connect(g); g.connect(AC.destination);
  src.start(t, rand(0,1)); src.stop(t+dur+.05);
}
function playBreak(kind, k, vol, made){
  if (!AC || !soundOn) return;
  const t = AC.currentTime, F = KIND[kind].freq;
  noiseBurst(t, .09+k*.12, 'bandpass', F*rand(.85,1.2), 1.2, .55*k+.2);   // the crack
  noiseBurst(t, .35+k*.3, 'lowpass', 420, .7, .5*k+.15);                 // body thud
  const crackles = Math.min(10, 2+made);
  for (let i=0;i<crackles;i++) noiseBurst(t+rand(.005,.09), rand(.02,.06), 'bandpass', F*rand(1.2,2.6), 2.5, rand(.08,.25)*k+.04);
  const o = AC.createOscillator(), g = AC.createGain();
  o.frequency.setValueAtTime(kind==='block'?95:140,t); o.frequency.exponentialRampToValueAtTime(40,t+.18);
  g.gain.setValueAtTime(.45*k+.1,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+.25);
}
function playHit(kind, s, vol){
  if (!AC || !soundOn || hitBudget<=0) return; hitBudget--;
  const t = AC.currentTime, small = vol<6e-5;
  const k = clamp(s/9,0,1) * (small ? .35 : .8);
  noiseBurst(t, small?.035:.08, 'bandpass', (small?3800:KIND[kind].freq)*rand(.8,1.3), small?3:1.5, k*.6);
  if (!small) noiseBurst(t, .15, 'lowpass', 300, .7, k*.5);
}

/* ---------------- aiming & throwing ---------------- */
let kind = 'brick';
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2(0,0);
let pointerIn = false, charging = false, chargeStart = 0, power = 0, cooldown = 0;
const aim = {point:V3(0,1,0), normal:V3(0,0,1), ok:false};

const reticle = new THREE.Mesh(new THREE.RingGeometry(.05,.068,40), new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:.75, depthTest:false}));
reticle.renderOrder = 10; scene.add(reticle);
const trajN = 64;
const trajGeo = new THREE.BufferGeometry(); trajGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(trajN*3),3));
const traj = new THREE.Line(trajGeo, new THREE.LineBasicMaterial({color:0xfff4e0, transparent:true, opacity:.4}));
traj.frustumCulled = false; scene.add(traj);

function updateAim(){
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects([wallMesh, groundMesh, backWall], false);
  if (hits.length){
    const h = hits[0]; aim.point.copy(h.point);
    aim.normal.copy(h.face.normal).transformDirection(h.object.matrixWorld);
  } else { aim.point.copy(raycaster.ray.origin).addScaledVector(raycaster.ray.direction, 20); aim.normal.set(0,0,1); }
  reticle.position.copy(aim.point).addScaledVector(aim.normal, .005);
  reticle.lookAt(aim.point.clone().add(aim.normal));
}
function spawnPoint(){ return V3(.28,-.3,-.45).applyQuaternion(camera.quaternion).add(camera.position); }
function launchVelocity(S, Tg, speed){
  const d = Tg.clone().sub(S); const t = Math.max(.12, d.length()/speed);
  return {v: d.multiplyScalar(1/t).add(V3(0, .5*9.81*t, 0)), t};
}
function powerSpeed(){ const K=KIND[kind]; return K.vmin + (K.vmax-K.vmin)*Math.pow(power, .9); }

function throwNow(){
  initAudio();
  const S = spawnPoint();
  const {v} = launchVelocity(S, aim.point, powerSpeed());
  const off = V3(rand(-50,50),rand(-50,50),rand(-50,50));
  const parts = kind==='brick' ? brickParts(off) : blockParts(off);
  const pc = makePiece(kind, parts, 0, 1);
  pc.body.position.set(S.x,S.y,S.z);
  const yaw = Math.atan2(v.x, v.z);
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(rand(-.25,.25), yaw + Math.PI/2 + rand(-.3,.3), rand(-.2,.2), 'YXZ'));
  pc.body.quaternion.set(q.x,q.y,q.z,q.w);
  pc.body.velocity.set(v.x,v.y,v.z);
  const spin = kind==='brick' ? 7 : 3;
  const ax = V3(1,0,0).applyQuaternion(q);
  const w = ax.multiplyScalar(-rand(.3,1)*spin).add(randUnit().multiplyScalar(rand(0,spin*.4)));
  pc.body.angularVelocity.set(w.x,w.y,w.z);
  pc.body.collisionFilterGroup = G_OLD; pc.body.collisionFilterMask = G_WORLD|G_OLD|G_NEW;
  syncMesh(pc); addPiece(pc);
  thrown++;
  $('sSpeed').textContent = Math.round(v.length()*3.6);
  cooldown = .35;
}

canvas.addEventListener('pointermove', e => { setNdc(e); pointerIn = true; });
canvas.addEventListener('pointerleave', () => { if (!charging) pointerIn = false; });
canvas.addEventListener('pointerdown', e => {
  initAudio(); setNdc(e); pointerIn = true;
  if (cooldown>0) return;
  charging = true; chargeStart = performance.now(); power = 0;
  canvas.setPointerCapture(e.pointerId);
});
const release = e => { if (!charging) return; charging = false; setNdc(e); updateAim(); throwNow(); power = 0; if (e.pointerType!=='mouse') pointerIn = false; };
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', () => { charging = false; power = 0; });
function setNdc(e){ const r = canvas.getBoundingClientRect(); ndc.set((e.clientX-r.left)/r.width*2-1, -((e.clientY-r.top)/r.height*2-1)); }

/* hand-held preview */
const hand = new THREE.Group(); camera.add(hand);
let handMesh = null;
function buildHand(){
  if (handMesh){ hand.remove(handMesh); handMesh.geometry.dispose(); }
  const parts = kind==='brick' ? brickParts(V3(3,7,1)) : blockParts(V3(3,7,1));
  handMesh = new THREE.Mesh(partsGeometry(parts, KIND[kind].tile), MATS[kind]);

buildHand();

function setKind(k){
  kind = k; $('kBrick').setAttribute('aria-pressed', k==='brick'); $('kBlock').setAttribute('aria-pressed', k==='block'); buildHand();
}
$('kBrick').onclick = () => setKind('brick');
$('kBlock').onclick = () => setKind('block');
window.addEventListener('keydown', e => { if (e.key==='1') setKind('brick'); if (e.key==='2') setKind('block'); });
$('bClear').onclick = () => { while (pieces.length) killPiece(pieces[0]); fragCount = 0; };
$('bSound').onclick = () => { soundOn = !soundOn; $('bSound').textContent = soundOn ? '音 ON' : '音 OFF'; initAudio(); };
$('bDist').onclick = () => { throwDist = throwDist===6 ? 3 : throwDist===3 ? 10 : 6; $('bDist').textContent = `距離 ${throwDist} m`; placeCamera(); };

/* ---------------- loop ---------------- */
function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w,h,false); camera.aspect = w/h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now-last)/1000); last = now;
  sim += dt; hitBudget = Math.min(8, hitBudget + dt*60);
  if (cooldown>0) cooldown -= dt;

  world.step(1/120, dt, 8);
  while (breakQueue.length) breakPiece(breakQueue.shift());

  for (let i=pieces.length-1;i>=0;i--){
    const pc = pieces[i];
    if (pc.newUntil && sim > pc.newUntil){ pc.body.collisionFilterGroup = G_OLD; pc.body.collisionFilterMask = G_WORLD|G_OLD|G_NEW; pc.newUntil = 0; }
    if (pc.body.position.y < -3 || Math.abs(pc.body.position.x) > 30 || pc.body.position.z > 25) { killPiece(pc); continue; }
    if (pc.body.sleepState !== CANNON.Body.SLEEPING) syncMesh(pc);
  }
  updateDust(dt);

  if (charging) power = Math.min(1, (now-chargeStart)/1100);
  $('meter').style.width = (power*100).toFixed(1)+'%';

  const showAim = pointerIn || charging;
  reticle.visible = showAim;
  if (showAim) updateAim();
  traj.visible = charging;
  if (charging){
    const S = spawnPoint(), {v,t} = launchVelocity(S, aim.point, powerSpeed());
    const arr = trajGeo.attributes.position.array;
    for (let i=0;i<trajN;i++){ const tt = t*i/(trajN-1);
      arr[i*3]=S.x+v.x*tt; arr[i*3+1]=S.y+v.y*tt-4.905*tt*tt; arr[i*3+2]=S.z+v.z*tt; }
    trajGeo.attributes.position.needsUpdate = true;
  }
  const hx = .3*Math.min(1, camera.aspect);
  hand.visible = cooldown <= 0;
  hand.position.set(hx + power*.05, (kind==='block'?-.36:-.3) + power*.04, (kind==='block'?-.72:-.55) + power*.16);
  hand.rotation.set(-power*.5, 0, -power*.15);

  $('sThrown').textContent = thrown; $('sBroken').textContent = broken; $('sFrag').textContent = fragCount;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
